server:
  forward-headers-strategy: framework
  compression:
    enabled: true
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

spring:
  cache:
    type: ${SPRING_CACHE_TYPE:redis}

  data:
    redis:
      url: ${REDIS_URL:}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 2s
      repositories:
        enabled: false

  rabbitmq:
    addresses: ${RABBITMQ_URL:}
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENER_AUTO_STARTUP:true}

finpulse:
  cache:
    dashboard-ttl-seconds: ${FINPULSE_CACHE_TTL_SECONDS:300}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://finpulse.eshace.com}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: ${HEALTH_REDIS_ENABLED:false}
    rabbit:
      enabled: ${HEALTH_RABBIT_ENABLED:false}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.finpulse: ${LOG_LEVEL_FINPULSE:INFO}
    org.springframework.security: WARN
